# Manifest dei dataset di Scudo: solo metadati, mai dati.
#
# Ogni voce è una data card in forma di dati (vedi docs/datasets.md). Revisione,
# licenza, gating e generatori sono stati letti il 2026-10-15 dall'API di
# Hugging Face (/api/datasets/<id> e /revision/main), dal README grezzo, dallo
# schema di datasets-server (first-rows) e, dove citato, dal paper. I modelli
# generatori hanno la licenza letta da /api/models/<id>.
#
# `generator_terms`: SÌ / NO / INCERTO dopo i filtri della voce. INCERTO blocca
# il training finché una persona non aggiunge una tabella `decision` con `by`,
# `on` e `rationale`: il codice e gli agenti non la compilano mai.
# `role = "benchmark"`: solo valutazione, deduplicato contro il training.

version = "2026-10-15"

# --- Training: richieste e risposte dannose ---------------------------------

[[dataset]]
name = "aegis2-train"
id = "nvidia/Aegis-AI-Content-Safety-Dataset-2.0"
role = "train"
revision = "d86bb8bedff51d25ac834ab7838f1cc61acb7a2c"
read_on = "2026-10-15"
config = "default"
splits = ["train"]
languages = ["en"]
surfaces = ["prompt", "response"]
license = "cc-by-4.0"
license_source = "API cardData.license e README («License: CC-BY-4.0»)"
gated = false
texts_by = "prompt umani da Anthropic/hh-rlhf (mit, rev 09be8c5bbc57cb3887f3a9732ad6aa7ec602a1fa); risposte di mistralai/Mistral-7B-v0.1; 5.000 rifiuti generati con Gemma-2-27B (file refusals_train.json)"
labels_by = "prompt_label: umani (prompt_label_source sempre human); response_label: human, llm_jury o refusal_data_augmentation"
generators = [
  "mistralai/Mistral-7B-v0.1 (apache-2.0): risposte",
  "mistralai/Mixtral-8x22B-v0.1 (apache-2.0): giuria llm_jury",
  "nvidia/Mistral-NeMo-12B-Instruct (apache-2.0): giuria llm_jury",
  "google/gemma-2-27b-it (gemma, gated manual): giuria llm_jury e rifiuti refusal_data_augmentation",
  "mistralai/Mixtral-8x7B-v0.1: dati topic-following citati dal README per il training del modello NVIDIA; presenza in questo dataset NON VERIFICATA",
]
generator_terms = "SÌ"
generator_terms_note = "Dopo i filtri: le righe refusal_data_augmentation (Gemma) escono per intero; le label llm_jury, con Gemma-2-27B in giuria, non sono gold e sono marcate needs_relabel per la giuria di teacher. Restano prompt umani (MIT), risposte Mistral-7B-v0.1 (apache-2.0) e label umane."
filters = [
  "righe con response_label_source = refusal_data_augmentation escluse per intero",
  "prompt REDACTED (Suicide Detection, non distribuiti) esclusi",
  "label llm_jury marcate needs_relabel: non entrano come gold prima della rietichettatura",
  "risposta senza testo o senza label: solo il caso prompt",
  "deduplica esatta e near-duplicate contro tutti i benchmark del manifest",
]
title = "Nemotron Content Safety Dataset V2 (Aegis AI Content Safety Dataset 2.0)"
authors = "NVIDIA; Ghosh, S., Varshney, P., Sreedhar, M. N., Padmakumar, A., Rebedea, T., Varghese, J. R., Parisien, C., «AEGIS2.0: A Diverse AI Safety Dataset and Risks Taxonomy for Alignment of LLM Guardrails», NAACL 2025"
url = "https://huggingface.co/datasets/nvidia/Aegis-AI-Content-Safety-Dataset-2.0"
changes = "selezione dello split train; esclusione dei rifiuti refusal_data_augmentation e dei prompt REDACTED; label safe/unsafe mappate su NO_VIOLATION/VIOLATION; un caso per prompt e uno per risposta con criterio testuale; marcatura delle label llm_jury; deduplica contro i benchmark; testi invariati, inseriti nel template del protocollo"
risks = [
  "contenuti dannosi per costruzione",
  "label llm_jury rumorose fino alla rietichettatura",
  "il README dichiara i dati non pensati per addestrare agenti di dialogo: Scudo addestra un sensore",
  "Nemotron v3 e Nemotron-Content-Safety-Reasoning riusano le stesse righe (stessi id)",
]

