[[dataset]]
name = "nemotron3-train"
id = "nvidia/Nemotron-Safety-Guard-Dataset-v3"
role = "train"
revision = "a3f7ecb3433d1933701a83f18de16c36934a7f51"
read_on = "2026-10-15"
config = "default"
splits = ["train"]
languages = ["it", "en"]
surfaces = ["prompt", "response"]
license = "cc-by-4.0"
license_source = "API cardData.license e README (License/Terms of Use)"
gated = false
texts_by = "pipeline CultureGuard su Aegis 2.0 (paper arXiv:2508.01710v4, §3.1-3.2): righe generic tradotte; righe adapted riscritte da Mixtral-8x22B e poi tradotte; jailbreak scritti con Mixtral-8x7B e risposte di Mixtral-8x22B; ogni testo non inglese tradotto con Google Cloud Translation («translated into the chosen target languages using Google Translate ... Google Cloud Platform (GCP) translation», §3.1.3)"
labels_by = "prompt_label_source e response_label_source: human, llm_jury, refusal_data_augmentation. Le label llm_jury (righe jailbreaking) sono il voto della giuria Llama-Nemotron-Safety-Guard-V2, PolyGuard-Qwen, Llama-3.1-Nemotron-70B-Instruct, Qwen3-235B-A22B, tenute solo se la maggioranza coincide con Qwen3-235B (§3.2); le righe adapted tengono la label originale solo se la giuria concorda (§3.1.2)"
generators = [
  "mistralai/Mixtral-8x22B (apache-2.0): adattamento culturale e risposte dei jailbreak (testo)",
  "Mixtral-8x7B (apache-2.0): prompt jailbreaking (testo)",
  "Google Cloud Translation API: tutto il testo non inglese, italiano compreso (testo); elencata tra le «AI/ML Services» di https://cloud.google.com/terms/services",
  "nvidia/llama-3.1-nemoguard-8b-content-safety (= Llama-Nemotron-Safety-Guard-V2; NVIDIA Open Model License più Llama 3.1, «Built with Llama»): giuria (label llm_jury) e filtro di coerenza dopo back-translation (scarta righe)",
  "nvidia/Llama-3.1-Nemotron-70B-Instruct (license: llama3.1; NVIDIA Open Model License più Llama 3.1): segregazione culturale (sceglie le righe da adattare) e giuria (label llm_jury)",
  "ToxicityPrompts/PolyGuard-Qwen (cc-by-4.0): giuria (label llm_jury)",
  "Qwen/Qwen3-235B-A22B (apache-2.0): giuria e arbitro del filtro jailbreak (label llm_jury)",
  "giudice FAITH delle traduzioni: modello non nominato (prompt in formato Llama 3.1, paper Fig. 10); solo filtro, soglia 3,5/5",
  "GPT-4o: solo valutazione di segregazione e adattamento (§3.1.1-3.1.2); nessuna riga scartata dichiarata",
  "Gemma-2-27B: righe refusal_data_augmentation ereditate da Aegis 2.0, escluse dal filtro",
]
generator_terms = "INCERTO"
generator_terms_note = "Fonti primarie lette il 2026-10-15. Mixtral, Qwen3 (apache-2.0) e PolyGuard-Qwen (cc-by-4.0) non limitano gli output. Restano due clausole che le fonti non chiudono. (1) Il testo italiano è output di Google Cloud Translation API; i Service Specific Terms GCP (versione del 12/10/2026, §17 «Use Restrictions for AI/ML Services», https://cloud.google.com/terms/service-terms) dicono «Customer will not, and will not allow End Users to use an AI/ML Service or Generated Output to develop a similar or competing product or service» e vietano di usare l'output «to: ... (ii) create or improve models similar to a Google Model» (Google Pre-Trained Model = «a model trained by Google and not released as an open model»). Non stabilito: se il vincolo del cliente (NVIDIA) passi a chi riceve il dataset CC BY, se un guard sia «similar to a Google Model», e quali termini valevano alla traduzione (2025, non letti). (2) Llama 3.1 §1.b.i (https://github.com/meta-llama/llama-models/blob/main/models/llama3_1/LICENSE): «If you use the Llama Materials or any outputs or results of the Llama Materials to create, train, fine tune, or otherwise improve an AI model, which is distributed or made available, you shall also include “Llama” at the beginning of any such AI model name». I modelli Llama hanno scritto le label llm_jury (marcate needs_relabel, mai gold) e filtrato le righe tradotte e adattate: se un filtro sia «results ... to create, train» per chi non è licenziatario Llama non è stabilito. Serve una decisione umana."
filters = [
  "lingue it e en",
  "righe refusal_data_augmentation escluse per intero",
  "prompt REDACTED esclusi",
  "label llm_jury marcate needs_relabel",
  "deduplica contro tutti i benchmark del manifest",
]
title = "Nemotron-Safety-Guard-Dataset-v3 (CultureGuard)"
authors = "NVIDIA; Joshi, R., Paul, R., Singla, K., Kamath, A., Evans, M., Luna, K., Ghosh, S., Vaidya, U., Long, E., Chauhan, S. S., et al., «CultureGuard: Towards Culturally-Aware Dataset and Guard Model for Multilingual Safety Applications», arXiv:2508.01710"
url = "https://huggingface.co/datasets/nvidia/Nemotron-Safety-Guard-Dataset-v3"
changes = "selezione delle righe it/en; esclusione dei rifiuti refusal_data_augmentation e dei prompt REDACTED; label mappate su VIOLATION/NO_VIOLATION; casi prompt e risposta; marcatura llm_jury; deduplica contro i benchmark"
risks = [
  "italiano tradotto a macchina, non nativo",
  "label llm_jury: 26% dei prompt e 78% delle risposte etichettate del train",
  "le righe del test hanno gli stessi id del test di Aegis 2.0",
  "se la clausola Llama 3.1 si applicasse, il nome del modello pubblicato dovrebbe iniziare con «Llama»",
]

[dataset.decision]
by = "naicud"
on = "2026-10-15"
rationale = "Ammessa con rischio registrato: è la fonte principale di italiano con licenza commerciale. Rischi aperti: traduzione con Google Cloud Translation (Service Specific Terms §17 sui modelli concorrenti) e filtri con modelli Llama 3.1 (clausola sul nome). Le label llm_jury restano marcate needs_relabel e non entrano come gold; da rivedere prima della pubblicazione dei pesi."

