[dataset.decision]
by = "naicud"
on = "2026-10-15"
rationale = "Esclusa: tutte le righe tradotte usano nvidia/Riva-Translate-4B-Instruct-v1.1, la cui NVIDIA Community Model License vieta di usare gli output per sviluppare altri modelli senza approvazione scritta di NVIDIA. Riammissibile solo con approvazione NVIDIA o con il solo sottoinsieme inglese, oggi INCERTO."

