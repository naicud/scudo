[project]
name = "scudo"
version = "0.0.0"
description = "Sensore semantico tri-state IT/EN: dataset, ricette di training, eval e model card"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
# Dipendenze pesanti solo per il training: Unsloth CUDA su Colab, smoke MLX sul
# Mac (macOS 14+, dove Unsloth porta con sé mlx). I limiti superiori di
# transformers e datasets seguono quelli dichiarati da Unsloth.
train = [
  "unsloth>=2026.10.5",
  "torch>=2.14,<2.15",
  "transformers>=5.17,<5.18",
  "datasets>=4.8,<5",
  "trl>=1.15,<2",
  "peft>=0.21,<1",
  # Kernel Triton dei layer Gated DeltaNet di Qwen3.5 (wheel pure Python, solo CUDA).
  "flash-linear-attention>=0.5.2,<0.6; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scudo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
